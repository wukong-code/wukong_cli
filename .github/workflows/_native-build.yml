name: _native-build

on:
  workflow_call:
    inputs:
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'wukong-native'
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 3
      sign-macos:
        description: 'Whether to sign + notarize macOS builds (requires Apple secrets)'
        required: false
        type: boolean
        default: false
      source-ref:
        description: 'Git ref to build; defaults to the triggering ref'
        required: false
        type: string
        default: ''
      require-exact-source-sha:
        description: 'Require source-ref to be the exact lowercase 40-character checked-out SHA'
        required: false
        type: boolean
        default: false
      expected-version:
        description: 'Require apps/wukong/package.json to contain this version'
        required: false
        type: string
        default: ''
      verify-native-install:
        description: 'Fresh-install the packaged artifact and optionally verify an upgrade'
        required: false
        type: boolean
        default: false
      upgrade-from-version:
        description: 'Public version to install before the packaged artifact; empty skips upgrade verification'
        required: false
        type: string
        default: ''
      publish-release-tag:
        description: 'When set, upload ZIP/SHA files directly to this public release tag'
        required: false
        type: string
        default: ''
      public-release-repo:
        description: 'Repository that owns the public binary release'
        required: false
        type: string
        default: 'mutnpc/wukong-code'
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false
      WUKONG_PUBLIC_RELEASE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  native-bundle:
    name: Native bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64

    env:
      WUKONG_CODE_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.ref }}
          persist-credentials: false

      - name: Verify exact source SHA
        if: inputs.require-exact-source-sha
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-ref }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source-ref must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify expected package version
        if: inputs.expected-version != ''
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected-version must be MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          actual_version="$(
            node -p "require('./apps/wukong/package.json').version"
          )"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo \
              "Expected apps/wukong version $EXPECTED_VERSION, got $actual_version" \
              >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup macOS keychain (release only)
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Generate built-in catalog (release artifacts)
        if: inputs.sign-macos
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/wukong-built-in-catalog.json"
          node apps/wukong/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "WUKONG_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build Wukong web assets
        # The SEA blob step embeds apps/wukong/dist-web; build the web app
        # and stage its assets before producing the native executable.
        # Also generate the vis-web single-file asset so the native bundle
        # can embed it instead of leaving a dynamic import in the SEA bundle.
        run: |
          node apps/wukong/scripts/build-vis-asset.mjs
          pnpm --filter @wukong/wukong-web run build
          node apps/wukong/scripts/copy-web-assets.mjs

      - name: Build native executable (release profile, macOS signed)
        if: runner.os == 'macOS' && inputs.sign-macos
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:release

      - name: Build native executable (local profile)
        if: '!(runner.os == ''macOS'' && inputs.sign-macos)'
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:sea

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-notarize
        with:
          binary-path: ${{ github.workspace }}/apps/wukong/dist-native/bin/${{ matrix.target }}/wukong
          notarization-key-p8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          notarization-key-id: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          notarization-issuer-id: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Smoke test native executable
        if: |
          !(
            (endsWith(matrix.target, '-x64') && runner.arch != 'X64') ||
            (endsWith(matrix.target, '-arm64') && runner.arch != 'ARM64')
          )
        shell: bash
        run: pnpm --filter @wukong.today/code run test:native:smoke

      - name: Package native artifact
        shell: bash
        run: pnpm --filter @wukong.today/code run package:native

      - name: Verify packaged fresh install and upgrade
        if: inputs.verify-native-install
        shell: bash
        env:
          WUKONG_NATIVE_UPGRADE_FROM_VERSION: ${{ inputs.upgrade-from-version }}
        run: pnpm --filter @wukong.today/code run test:native:install

      - name: Upload native artifact
        if: inputs.publish-release-tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

      - name: Upload native artifact directly to public release
        if: inputs.publish-release-tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WUKONG_PUBLIC_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ inputs.public-release-repo }}
          RELEASE_TAG: ${{ inputs.publish-release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip" \
            "apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip.sha256" \
            --clobber \
            --repo "$RELEASE_REPO"
