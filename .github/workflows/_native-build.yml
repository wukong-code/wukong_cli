name: _native-build

on:
  workflow_call:
    inputs:
      upload-artifact-prefix:
        description: 'Prefix for staged Actions artifacts'
        required: false
        type: string
        default: 'wukong-native'
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 3
      release-artifact:
        description: 'Embed the provider catalog and use the release build profile'
        required: false
        type: boolean
        default: true
      sign-macos:
        description: 'Require Developer ID signing and notarization for both macOS builds'
        required: false
        type: boolean
        default: false
      source-ref:
        description: 'Git ref to build; defaults to the triggering ref'
        required: false
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  validate-release-contract:
    name: Validate native release inputs
    runs-on: ubuntu-latest
    env:
      SIGN_MACOS: ${{ inputs.sign-macos }}
      RELEASE_ARTIFACT: ${{ inputs.release-artifact }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: Fail closed when signing inputs are incomplete
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_MACOS" != "true" ]]; then
            exit 0
          fi
          if [[ "$RELEASE_ARTIFACT" != "true" ]]; then
            echo '::error::macOS signing is only valid for release artifacts.'
            exit 1
          fi
          for NAME in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARIZATION_KEY_P8 \
            APPLE_NOTARIZATION_KEY_ID \
            APPLE_NOTARIZATION_ISSUER_ID; do
            if [[ -z "${!NAME}" ]]; then
              echo "::error::${NAME} is required for a public macOS release."
              exit 1
            fi
          done

  native-bundle:
    name: Native bundle (${{ matrix.target }})
    needs: validate-release-contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64

    env:
      WUKONG_CODE_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup macOS keychain
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Generate built-in provider catalog
        if: inputs.release-artifact
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_FILE="$RUNNER_TEMP/wukong-built-in-catalog.json"
          node apps/wukong/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          test -s "$CATALOG_FILE"
          echo "WUKONG_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build Wukong web assets
        shell: bash
        run: |
          set -euo pipefail
          node apps/wukong/scripts/build-vis-asset.mjs
          pnpm --filter @wukong/wukong-web run build
          node apps/wukong/scripts/copy-web-assets.mjs

      - name: Build native executable (release profile)
        if: inputs.release-artifact
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:release

      - name: Build native executable (local profile)
        if: inputs.release-artifact == false
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:sea

      - name: Notarize macOS binary
        id: macos_notarize
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-notarize
        with:
          binary-path: ${{ github.workspace }}/apps/wukong/dist-native/bin/${{ matrix.target }}/wukong
          notarization-key-p8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          notarization-key-id: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          notarization-issuer-id: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Package native artifact
        shell: bash
        run: pnpm --filter @wukong.today/code run package:native

      - name: Record exact build identity
        shell: bash
        env:
          RELEASE_PROFILE: ${{ inputs.release-artifact && 'release' || 'local' }}
          MACOS_SIGNED: ${{ steps.macos_notarize.outputs.signed-and-notarized || 'false' }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          node apps/wukong/scripts/native/write-release-metadata.mjs \
            "${{ matrix.target }}" "$SOURCE_SHA" "$RELEASE_PROFILE" "$MACOS_SIGNED"

      - name: Smoke test final ZIP without catalog network access
        if: |
          !(
            (endsWith(matrix.target, '-x64') && runner.arch != 'X64') ||
            (endsWith(matrix.target, '-arm64') && runner.arch != 'ARM64')
          )
        shell: bash
        env:
          WUKONG_CODE_NATIVE_SMOKE_ARCHIVE: ${{ github.workspace }}/apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip
        run: pnpm --filter @wukong.today/code run test:native:smoke

      - name: Upload staged native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip.sha256
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.build.json
          if-no-files-found: error
