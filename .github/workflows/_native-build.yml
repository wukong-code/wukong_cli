name: _native-build

on:
  workflow_call:
    inputs:
      upload-artifact-prefix:
        description: 'Prefix for staged Actions artifacts'
        required: false
        type: string
        default: 'wukong-native'
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 3
      release-artifact:
        description: 'Embed the provider catalog and use the release build profile'
        required: false
        type: boolean
        default: true
      sign-macos:
        description: 'Require Developer ID signing and notarization for both macOS builds'
        required: false
        type: boolean
        default: false
      source-ref:
        description: 'Git ref to build; defaults to the triggering ref'
        required: false
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  validate-release-contract:
    name: Validate native release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      SIGN_MACOS: ${{ inputs.sign-macos }}
      RELEASE_ARTIFACT: ${{ inputs.release-artifact }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: Resolve the requested source once
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-ref != '' && inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Record the exact source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Native builds require one exact 40-character source commit."
            exit 1
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fail closed when signing inputs are incomplete
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_MACOS" != "true" ]]; then
            exit 0
          fi
          if [[ "$RELEASE_ARTIFACT" != "true" ]]; then
            echo '::error::macOS signing is only valid for release artifacts.'
            exit 1
          fi
          for NAME in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARIZATION_KEY_P8 \
            APPLE_NOTARIZATION_KEY_ID \
            APPLE_NOTARIZATION_ISSUER_ID; do
            if [[ -z "${!NAME}" ]]; then
              echo "::error::${NAME} is required for a public macOS release."
              exit 1
            fi
          done

  prepare-release-catalog:
    name: Prepare one release catalog snapshot
    needs: validate-release-contract
    if: inputs.release-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release-contract.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate one exact catalog for all six builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wukong-release-catalog"
          node apps/wukong/scripts/update-catalog.mjs \
            --out "$RUNNER_TEMP/wukong-release-catalog/catalog.json" \
            --metadata-out "$RUNNER_TEMP/wukong-release-catalog/catalog-metadata.json"

      - name: Upload exact release catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wukong-release-catalog
          retention-days: ${{ inputs.retention-days }}
          path: |
            ${{ runner.temp }}/wukong-release-catalog/catalog.json
            ${{ runner.temp }}/wukong-release-catalog/catalog-metadata.json
          if-no-files-found: error

  native-bundle:
    name: Native bundle (${{ matrix.target }})
    needs:
      - validate-release-contract
      - prepare-release-catalog
    if: >-
      ${{ always()
          && needs.validate-release-contract.result == 'success'
          && (needs.prepare-release-catalog.result == 'success'
              || needs.prepare-release-catalog.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64

    env:
      WUKONG_CODE_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release-contract.outputs.source_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cross-platform Resume, cancellation, quoting, and process lifecycle tests
        shell: bash
        run: |
          pnpm exec vitest run \
            apps/wukong/test/cli/run-prompt.test.ts \
            packages/agent-core/test/agent/v0.0.22-compat.test.ts \
            packages/agent-core/test/harness/goal-session.test.ts \
            packages/agent-core/test/tools/shell-cancel.test.ts \
            packages/agent-core/test/tools/shell-quoting.test.ts \
            packages/agent-core/test/tools/bash-windows-kill.test.ts \
            packages/kosong/test/e2e/provider-error-handling.test.ts \
            packages/kaos/test/e2e/process-lifecycle.test.ts \
            --testTimeout=30000

      - name: Setup macOS keychain
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Download exact shared provider catalog
        if: inputs.release-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wukong-release-catalog
          path: ${{ runner.temp }}/wukong-release-catalog

      - name: Bind exact shared provider catalog
        if: inputs.release-artifact
        shell: bash
        run: |
          set -euo pipefail
          CATALOG_FILE="$RUNNER_TEMP/wukong-release-catalog/catalog.json"
          CATALOG_METADATA_FILE="$RUNNER_TEMP/wukong-release-catalog/catalog-metadata.json"
          test -s "$CATALOG_FILE"
          test -s "$CATALOG_METADATA_FILE"
          echo "WUKONG_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"
          echo "WUKONG_CODE_BUILT_IN_CATALOG_METADATA_FILE=$CATALOG_METADATA_FILE" >> "$GITHUB_ENV"

      - name: Build Wukong web assets
        shell: bash
        run: |
          set -euo pipefail
          node apps/wukong/scripts/build-vis-asset.mjs
          pnpm --filter @wukong/wukong-web run build
          node apps/wukong/scripts/copy-web-assets.mjs

      - name: Build native executable (release profile)
        if: inputs.release-artifact
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:release

      - name: Build native executable (local profile)
        if: inputs.release-artifact == false
        shell: bash
        run: pnpm --filter @wukong.today/code run build:native:sea

      - name: Notarize macOS binary
        id: macos_notarize
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-notarize
        with:
          binary-path: ${{ github.workspace }}/apps/wukong/dist-native/bin/${{ matrix.target }}/wukong
          notarization-key-p8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          notarization-key-id: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          notarization-issuer-id: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Package native artifact
        shell: bash
        run: pnpm --filter @wukong.today/code run package:native

      - name: Record exact build identity
        shell: bash
        env:
          RELEASE_PROFILE: ${{ inputs.release-artifact && 'release' || 'local' }}
          MACOS_SIGNED: ${{ steps.macos_notarize.outputs.signed-and-notarized || 'false' }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          node apps/wukong/scripts/native/write-release-metadata.mjs \
            "${{ matrix.target }}" "$SOURCE_SHA" "$RELEASE_PROFILE" "$MACOS_SIGNED"

      - name: Smoke test final ZIP without catalog network access
        if: |
          !(
            (endsWith(matrix.target, '-x64') && runner.arch != 'X64') ||
            (endsWith(matrix.target, '-arm64') && runner.arch != 'ARM64')
          )
        shell: bash
        env:
          WUKONG_CODE_NATIVE_SMOKE_ARCHIVE: ${{ github.workspace }}/apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip
          WUKONG_CODE_EXPECT_BUILT_IN_CATALOG: ${{ inputs.release-artifact && '1' || '0' }}
        run: pnpm --filter @wukong.today/code run test:native:smoke

      - name: Upload staged native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.zip.sha256
            apps/wukong/dist-native/artifacts/wukong-${{ matrix.target }}.build.json
          if-no-files-found: error

  verify-release-identity:
    name: Verify one six-platform release identity
    needs:
      - validate-release-contract
      - native-bundle
    if: inputs.release-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-release-contract.outputs.source_sha }}
          persist-credentials: false

      - name: Download all six staged targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.upload-artifact-prefix }}-*
          path: ${{ runner.temp }}/wukong-native-staging
          merge-multiple: true

      - name: Verify source, version, catalog, checksums, archives, and signing state
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-release-contract.outputs.source_sha }}
          EXPECT_MACOS_SIGNING: ${{ inputs.sign-macos }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/wukong/package.json').version")"
          node apps/wukong/scripts/native/verify-release-staging.mjs \
            "$RUNNER_TEMP/wukong-native-staging" \
            "v$VERSION" \
            "$SOURCE_SHA" \
            "$RUNNER_TEMP/wukong-native-verified" \
            "$EXPECT_MACOS_SIGNING"
