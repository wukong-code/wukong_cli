name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Tiered runs: pull requests and main pushes run the light checks only; the
# full verification suite runs for release tags (v*) and manual dispatch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify trigger and changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      full_suite: ${{ steps.filter.outputs.full_suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Release tags and manual dispatch always run the full suite.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          DOCS_ONLY=true
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              *.md|docs/*|LICENSE*) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "$FILES"
          echo "docs_only=${DOCS_ONLY}" >> "$GITHUB_OUTPUT"
          echo "full_suite=false" >> "$GITHUB_OUTPUT"
          echo "Docs-only: ${DOCS_ONLY}"
          echo "$FILES"

  docs:
    name: Docs-only acknowledgment
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Docs-only pull request; the full verification suite runs at release time."

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif

  build:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/wukong run smoke

  test:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  # Coverage gate is scoped to apps/wukong (vitest project `cli`) so the full
  # monorepo suite stays fast. Thresholds apply via CI=true in vitest.config.ts.
  # Reproduce locally: `pnpm test:coverage:gate -- --project cli`
  test-coverage:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage:cli
      - name: Upload coverage summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary-cli
          path: |
            coverage/coverage-summary.json
            coverage/index.html
          if-no-files-found: ignore
          retention-days: 1

  test-install:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install bats
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run install script tests
        run: bats tests/install.bats

  test-windows:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm exec vitest run --testTimeout=30000

  verification-criteria-cross-platform:
    name: Verification criteria (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/verification/test/criteria.test.ts packages/verification/test/review-subject.test.ts apps/wukong/test/cli/reference-verification-skills.test.ts packages/agent-core/test/tools/goal-gate.test.ts --testTimeout=30000
      - name: Repeat deterministic criteria and Gate matrix to three total runs
        shell: bash
        run: |
          for run in 2 3; do
            echo "stability run ${run}/3"
            pnpm exec vitest run packages/verification/test/criteria.test.ts packages/agent-core/test/tools/goal-gate.test.ts --testTimeout=30000
          done

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - docs
      - lint
      - build
      - test
      - test-coverage
      - test-install
      - test-windows
      - verification-criteria-cross-platform
      - typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the checks for this trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.test-coverage.result }}
          INSTALL_RESULT: ${{ needs.test-install.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          CRITERIA_RESULT: ${{ needs.verification-criteria-cross-platform.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success

          if [[ "$FULL_SUITE" = true ]]; then
            for result in "$BUILD_RESULT" "$TEST_RESULT" "$COVERAGE_RESULT" \
              "$INSTALL_RESULT" "$WINDOWS_RESULT" "$CRITERIA_RESULT" "$TYPECHECK_RESULT"; do
              test "$result" = success
            done
          elif [[ "$DOCS_ONLY" = true ]]; then
            test "$DOCS_RESULT" = success
          else
            test "$LINT_RESULT" = success
          fi

          echo "CI gate passed for ${EVENT_NAME} on ${REF}."

  typecheck:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate vis web asset
        run: node apps/wukong/scripts/build-vis-asset.mjs
      - name: Typecheck
        run: |
          pnpm run typecheck
      - name: Typecheck wukong-web (vue-tsc)
        run: pnpm --filter @wukong/wukong-web run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @wukong/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @wukong/vis-web run typecheck
