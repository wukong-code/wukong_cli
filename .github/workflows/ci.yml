name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/wukong run smoke

  test:
    runs-on: ubuntu-latest
    outputs:
      installer_changed: ${{ steps.test-scope.outputs.installer_changed }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Select affected or full test scope
        id: test-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          full=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha=""
            full=true
          fi

          if [[ -z "$base_sha" \
            || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            full=true
          elif [[ "$full" == "false" ]] \
            && ! git cat-file -e "${base_sha}^{commit}"; then
            full=true
          fi

          if [[ "$full" == "false" ]]; then
            git diff --name-only "$base_sha"...HEAD \
              > "$RUNNER_TEMP/changed-files.txt"
            if grep -Eq \
              '(^|/)(package\.json|tsconfig(\.[^/]*)?\.json)$|^(pnpm-lock\.yaml|pnpm-workspace\.yaml|vitest\.config\.ts|\.nvmrc)$|^scripts/|^\.github/workflows/' \
              "$RUNNER_TEMP/changed-files.txt"; then
              full=true
            fi
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

          wukong_web_changed="$full"
          vis_server_changed="$full"
          vis_web_changed="$full"
          installer_changed="$full"
          if [[ "$full" == "false" ]]; then
            if grep -Eq '^apps/wukong-web/' "$RUNNER_TEMP/changed-files.txt"; then
              wukong_web_changed=true
            fi
            if grep -Eq '^apps/vis/server/' "$RUNNER_TEMP/changed-files.txt"; then
              vis_server_changed=true
            fi
            if grep -Eq '^apps/vis/web/' "$RUNNER_TEMP/changed-files.txt"; then
              vis_web_changed=true
            fi
            if grep -Eq '^(install\.sh|tests/install\.bats)$' \
              "$RUNNER_TEMP/changed-files.txt"; then
              installer_changed=true
            fi
          fi

          echo "wukong_web_changed=$wukong_web_changed" >> "$GITHUB_OUTPUT"
          echo "vis_server_changed=$vis_server_changed" >> "$GITHUB_OUTPUT"
          echo "vis_web_changed=$vis_web_changed" >> "$GITHUB_OUTPUT"
          echo "installer_changed=$installer_changed" >> "$GITHUB_OUTPUT"

      - name: Run full suite for test-infrastructure changes
        if: steps.test-scope.outputs.full == 'true'
        run: pnpm run test:full:bounded

      - name: Run affected tests
        if: steps.test-scope.outputs.full == 'false'
        run: |
          pnpm exec vitest run \
            --changed="${{ steps.test-scope.outputs.base_sha }}" \
            --passWithNoTests \
            --maxWorkers=2

      - name: Run mandatory safety anchors
        if: steps.test-scope.outputs.full == 'false'
        run: |
          pnpm exec vitest run \
            packages/verification/test/criteria.test.ts \
            packages/verification/test/redaction.test.ts \
            packages/verification/test/review-subject.test.ts \
            packages/verification/test/source-snapshot.test.ts \
            packages/verification/test/target-state-fingerprint-builder.test.ts \
            packages/verification/test/target-promotion.test.ts \
            packages/verification/test/target-final-gate.test.ts \
            packages/verification/test/target-gate-completion-seal.test.ts \
            packages/verification/test/trusted-executable.test.ts \
            packages/agent-core/test/tools/candidate-workspace-guard.test.ts \
            packages/agent-core/test/candidate-delta-store.test.ts \
            packages/agent-core/test/promotion-change-applier.test.ts \
            packages/agent-core/test/target-promotion-workspace-backend.test.ts \
            packages/agent-core/test/candidate-workspace-backend-capability.test.ts \
            packages/agent-core/test/tools/goal-gate.test.ts \
            apps/wukong/test/cli/reference-verification-skills.test.ts \
            apps/wukong/test/cli/loop-preflight.test.ts \
            apps/wukong/test/cli/loop.test.ts \
            apps/wukong/test/cli/run-shell.test.ts \
            --maxWorkers=2

      - name: Run affected Wukong Web suite
        if: steps.test-scope.outputs.wukong_web_changed == 'true'
        run: pnpm --filter @wukong/wukong-web test

      - name: Run affected Vis Server suite
        if: steps.test-scope.outputs.vis_server_changed == 'true'
        run: pnpm --filter @wukong/vis-server test

      - name: Run affected Vis Web suite
        if: steps.test-scope.outputs.vis_web_changed == 'true'
        run: pnpm --dir apps/vis/web exec vitest run

  test-install:
    needs: test
    if: >-
      ${{
        always()
        && needs.test.outputs.installer_changed == 'true'
      }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run install script tests
        run: bats tests/install.bats

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate vis web asset
        run: node apps/wukong/scripts/build-vis-asset.mjs
      - name: Typecheck
        run: |
          pnpm dlx --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/wukong/tsconfig.json; do
            echo "Typechecking ${config}"
            pnpm dlx --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck wukong-web (vue-tsc)
        run: pnpm --filter @wukong/wukong-web run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @wukong/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @wukong/vis-web run typecheck
