name: Nightly full verification

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-verification
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run bounded monorepo suite excluding CLI
        run: pnpm run test:full:bounded:no-cli

      # Coverage executes the complete CLI project, so running the ordinary
      # CLI suite above would duplicate more than two thousand tests.
      - name: Run complete CLI suite with coverage gate
        run: pnpm run test:coverage:cli:gate -- --maxWorkers=2

      - name: Run web and visualization suites excluded by root Vitest projects
        run: |
          pnpm --filter @wukong/wukong-web test
          pnpm --filter @wukong/vis-server test
          pnpm --dir apps/vis/web exec vitest run

      - name: Upload coverage summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-summary-cli
          path: |
            coverage/coverage-summary.json
            coverage/index.html
          if-no-files-found: ignore
          retention-days: 7

  verification-criteria-cross-platform:
    name: Verification criteria (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux is covered by the full job. Keep the costly hosted platforms
        # out of every PR/push while retaining scheduled cross-platform proof.
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Run cross-platform verification contracts
        run: >-
          pnpm exec vitest run
          packages/verification/test/criteria.test.ts
          packages/verification/test/review-subject.test.ts
          apps/wukong/test/cli/reference-verification-skills.test.ts
          packages/agent-core/test/tools/goal-gate.test.ts
          --testTimeout=30000
